name: Build static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'content/**', 'lib/**', 'next.config.ts', 'styles.css', 'tina/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          NODE_OPTIONS: --no-experimental-webstorage --max-old-space-size=4096
        run: |
          pnpm exec tinacms dev --noTelemetry --noWatch > /tmp/tina-build.log 2>&1 &
          tina_pid=$!

          cleanup() {
            kill "$tina_pid" 2>/dev/null || true
            wait "$tina_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:4001/graphql --output /dev/null; then
              break
            fi

            if [ "$attempt" = 90 ]; then
              cat /tmp/tina-build.log
              exit 1
            fi

            sleep 1
          done

          pnpm exec next build

      - name: Verify static export
        run: test -d out

      - name: Store static-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
