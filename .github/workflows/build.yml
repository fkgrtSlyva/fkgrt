name: Build and deploy static site preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: FTP operation for /www/test-new only
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: test-new-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ github.event_name != 'pull_request' && 'production' || null }}
    env:
      NEXT_PUBLIC_BASE_PATH: /test-new
      NEXT_PUBLIC_SITE_URL: https://fkgrt.knu.ua/test-new
      NEXT_PUBLIC_TINA_BRANCH: main
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_TINA_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-test-new-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'content/**', 'lib/**', 'next.config.ts', 'styles.css', 'tina/**') }}
          restore-keys: |
            next-test-new-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokenless static export
        run: pnpm build

      - name: Verify isolated preview export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/admin/index.html
          grep -q '/test-new/_next/' out/index.html
          grep -q 'ErrorDocument 404 /test-new/404.html' out/.htaccess

      - name: Store static-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-test-new-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Validate SFTP configuration
        if: >-
          github.event_name != 'pull_request' &&
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.deployment == 'dry-run' || inputs.deployment == 'publish')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Install SFTP mirror client
        if: >-
          github.event_name != 'pull_request' &&
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.deployment == 'dry-run' || inputs.deployment == 'publish')
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Pin preview server SSH host key
        if: >-
          github.event_name != 'pull_request' &&
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.deployment == 'dry-run' || inputs.deployment == 'publish')
        run: echo 'fkgrt.knu.ua ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAPwIhexWRR2CWXLzDQZ6Z2mvw27fPnkz6akoQqORJP+' > "$RUNNER_TEMP/fkgrt-known-hosts"

      - name: Dry-run SFTP synchronization to isolated preview directory
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deployment == 'dry-run' &&
          vars.FTP_DEPLOY_ENABLED == 'true'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          lftp <<LFTP
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/fkgrt-known-hosts"
          set net:timeout 30
          set net:max-retries 2
          open --user "$SFTP_USERNAME" --env-password "sftp://$SFTP_SERVER:22"
          mirror --reverse --delete --parallel=4 --no-perms --verbose=1 --dry-run --exclude-glob admin/** --exclude-glob upload/resize_cache/** ./out/ /www/test-new/
          mirror --reverse --transfer-all --parallel=4 --no-perms --verbose=1 --dry-run --include='\.(html|txt|json)$' --exclude-glob admin/** --exclude-glob upload/resize_cache/** ./out/ /www/test-new/
          bye
          LFTP

      - name: Publish isolated preview directory
        if: >-
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'publish'))
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          lftp <<LFTP
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/fkgrt-known-hosts"
          set net:timeout 30
          set net:max-retries 2
          open --user "$SFTP_USERNAME" --env-password "sftp://$SFTP_SERVER:22"
          mirror --reverse --delete --parallel=4 --no-perms --verbose=1 --exclude-glob admin/** --exclude-glob upload/resize_cache/** ./out/ /www/test-new/
          mirror --reverse --transfer-all --parallel=4 --no-perms --verbose=1 --include='\.(html|txt|json)$' --exclude-glob admin/** --exclude-glob upload/resize_cache/** ./out/ /www/test-new/
          bye
          LFTP

      - name: Verify deployed Next.js assets
        if: >-
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'publish'))
        run: |
          python3 - <<'PYTHON'
          import html.parser
          import urllib.request

          site_url = "https://fkgrt.knu.ua/test-new/"

          class AssetParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = set()

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  asset = attributes.get("src") or attributes.get("href")
                  if asset and "/test-new/_next/" in asset:
                      self.assets.add(asset)

          parser = AssetParser()
          with urllib.request.urlopen(site_url) as response:
              parser.feed(response.read().decode())

          for asset in sorted(parser.assets):
              with urllib.request.urlopen(f"https://fkgrt.knu.ua{asset}") as response:
                  if response.status != 200:
                      raise RuntimeError(f"{asset} returned HTTP {response.status}")

          print(f"Verified {len(parser.assets)} deployed Next.js assets")
          PYTHON
