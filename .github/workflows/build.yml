name: Build and deploy static site preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment:
        description: FTP operation for /www/test-new only
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: test-new-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ github.event_name != 'pull_request' && 'production' || null }}
    env:
      NEXT_PUBLIC_BASE_PATH: /test-new
      NEXT_PUBLIC_SITE_URL: https://fkgrt.knu.ua/test-new
      NEXT_PUBLIC_TINA_BRANCH: main
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_TINA_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-test-new-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'content/**', 'lib/**', 'next.config.ts', 'styles.css', 'tina/**') }}
          restore-keys: |
            next-test-new-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokenless static export
        run: pnpm build

      - name: Verify isolated preview export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/admin/index.html
          grep -q '/test-new/_next/' out/index.html
          grep -q 'ErrorDocument 404 /test-new/404.html' out/.htaccess

      - name: Store static-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-test-new-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Validate FTP configuration
        if: >-
          github.event_name != 'pull_request' &&
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' || inputs.deployment == 'dry-run' || inputs.deployment == 'publish')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Dry-run FTP synchronization to isolated preview directory
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deployment == 'dry-run' &&
          vars.FTP_DEPLOY_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: /www/test-new/
          state-name: .ftp-deploy-sync-state-test-new.json
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            admin/**
            upload/resize_cache/**

      - name: Publish isolated preview directory
        if: >-
          vars.FTP_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'publish'))
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: /www/test-new/
          state-name: .ftp-deploy-sync-state-test-new.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            admin/**
            upload/resize_cache/**
